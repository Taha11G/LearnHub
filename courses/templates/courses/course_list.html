<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courses | LearnHub</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
            line-height: 1.6;
        }

        header {
            background: #173b80;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(min(100%, 280px), 1fr)
            );
            gap: 20px;
        }

        article {
            background: white;
            padding: 24px;
            border: 1px solid #dce3ef;
            border-radius: 12px;
        }

        article h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <header>LearnHub</header>

    <main>
        <h1>Explore courses</h1>

        <div class="course-grid">
            {% for course in courses %}
                <article>
                    <h2>{{ course.title }}</h2>
                    <p>{{ course.description }}</p>
                </article>
            {% empty %}
                <p>No courses are available yet. Check back soon.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
